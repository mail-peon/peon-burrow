# 打 tag 时：三平台构建 → 打包 → 校验和 → 传 Release → 生成 latest.json
#
# 产物命名是**契约**（`ai-docs/release.md § 2.2`）：
#   peon-burrow-<target>.tar.gz / .zip   ← 自更新下载的就是它
#   burrow-<target>[.exe]                ← 桌面端 sidecar 直接取这个原始二进制
# 改了名字 = 老版本再也找不到更新，别改。
name: assets

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 构建
        run: cargo build --release --locked --target ${{ matrix.target }} -p peon-burrow

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-release.ps1 -Target "${{ matrix.target }}"

      - name: 打包（Unix）
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/package-release.sh "${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: 发布 Release（含 latest.json）
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: 生成 latest.json
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          channel="stable"
          case "$GITHUB_REF_NAME" in *-beta*) channel="beta";; esac
          ./scripts/make-manifest.sh "$version" "$channel" dist > dist/latest.json
          cat dist/latest.json

          # 守住一条契约：自更新不解压，清单里的资产必须是裸二进制。
          # 这条如果漏了，用户侧的表现是「更新永远失败」，而这里是最容易发现的地方。
          if grep -Eq '"(name|target)": *"[^"]*\.(zip|tar\.gz|tgz)"' dist/latest.json; then
            echo "::error::latest.json 指向了压缩包；自更新不会解压，必须指向裸二进制"
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true