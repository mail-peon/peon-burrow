# 被 release.yaml 调用的**可复用工作流**（`workflow_call`）：三平台构建 → 打包 → 校验和
# → 传 GitHub Release → 生成 latest.json。
#
# 产物命名是**契约**（`ai-docs/release.md § 2.2`）：
#   peon-burrow-<target>.tar.gz / .zip   ← 人手动下载用
#   burrow-<target>[.exe]                ← **自更新下载的就是它**（update crate 不解压）
#   latest.json                          ← 清单：字段 camelCase、资产指裸二进制
# 改了名字（或让清单指向压缩包）= 老版本再也找不到更新，别改。
#
# ⚠️ 除注释外**不要写中文**（含 job/step 的 name 与 echo 文案）。
name: assets

on:
  workflow_call:

# 上传到 Release 需要写权限；被调用时不可能超过调用方给的上限
permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }} -p peon-burrow

      - name: package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-release.ps1 -Target "${{ matrix.target }}"

      - name: package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/package-release.sh "${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release and latest.json
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: generate latest.json
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          channel="stable"
          case "$GITHUB_REF_NAME" in *-beta*) channel="beta";; esac
          ./scripts/make-manifest.sh "$version" "$channel" dist > dist/latest.json
          cat dist/latest.json

          # 守住一条契约：自更新不解压，清单里的资产必须是裸二进制。
          # 这条如果漏了，用户侧的表现是「更新永远失败」，而这里是最容易发现的地方。
          if grep -Eq '"(name|target)": *"[^"]*\.(zip|tar\.gz|tgz)"' dist/latest.json; then
            echo "::error::latest.json points at an archive; the updater does not unpack archives, the asset must be a raw binary"
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
