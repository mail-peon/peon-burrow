# **本仓库唯一的自动化入口**：只由 `v*.*.*` tag 触发。
#
#   1) checks —— 复用 ci.yaml（三平台 lint/test/doc + MSRV + 布局守卫 + semver）
#   2) verify —— tag 必须等于 workspace 版本 + 依赖顺序自检
#   3) assets —— 复用 assets.yaml（五个目标的产物 + latest.json + GitHub Release）
#   4) crates —— dry-run 之后按序发到 crates.io
#
# 没有 push / pull_request / workflow_dispatch 入口：检查发生在发版那一刻。
# 失败时**不要移动 tag** —— 修好之后从 Actions 页面重跑失败的 job 即可
# （重跑不需要重新触发，所以 tag 不用动）。
#
# 顺序是**硬约束**（`ai-docs/decisions/adr-0009-crates-io-publishing.md`）：
#   protocol → core → ipc-types → ipc → service → update → peon-burrow
#
# ⚠️ 除注释外**不要写中文**（含 job/step 的 name 与 echo 文案）。
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CRATES: peon-burrow-protocol peon-burrow-core peon-burrow-ipc-types peon-burrow-ipc peon-burrow-service peon-burrow-update peon-burrow

jobs:
  checks:
    name: pre-release checks
    uses: ./.github/workflows/ci.yaml

  verify:
    name: version and dependency order
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: tag must match the workspace version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          echo "tag=$tag workspace=$version"
          [ "$tag" = "$version" ] || { echo "::error::tag does not match the Cargo.toml version"; exit 1; }
      - name: dependency order self-check
        shell: bash
        run: |
          set -euo pipefail
          # 每个包**只能**依赖它前面已经发过的包（或者不依赖本仓库的包）
          for crate in $CRATES; do
            echo "--- $crate"
            cargo tree -p "$crate" --depth 1 | grep 'peon-burrow' || true
          done

  assets:
    name: assets and release
    needs: [checks, verify]
    uses: ./.github/workflows/assets.yaml
    # 被调用的工作流要往 Release 里传文件，权限必须在这里显式给
    permissions:
      contents: write

  crates-dry-run:
    name: cargo publish dry run
    needs: [checks, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - shell: bash
        run: |
          set -euo pipefail
          for crate in $CRATES; do
            echo "=== dry-run $crate"
            cargo publish -p "$crate" --dry-run --locked
          done

  crates-publish:
    name: publish to crates.io
    needs: [crates-dry-run]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: publish in dependency order
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          for crate in $CRATES; do
            echo "=== publishing $crate"
            # 索引有延迟：失败就等一会儿重试，而不是直接红
            for attempt in 1 2 3 4 5; do
              if cargo publish -p "$crate" --locked; then break; fi
              echo "attempt $attempt failed, retrying in 30s (the registry index is usually just lagging)"
              sleep 30
              [ "$attempt" -lt 5 ] || { echo "::error::failed to publish $crate"; exit 1; }
            done
          done
