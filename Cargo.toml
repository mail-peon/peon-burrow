# peon-burrow workspace —— 一个库项目：稳定层 + 一个带 `burrow` 二进制的产品 crate。
# 布局与稳定性分层见 ai-docs/modules.md、STABILITY.md；实现顺序见 ai-docs/implementation-order.md。

[workspace]
resolver = "3"
members = [
  "crates/peon-burrow-protocol",
  "crates/peon-burrow-core",
  "crates/peon-burrow-ipc-types",
  "crates/peon-burrow-ipc",
  "crates/peon-burrow-service",
  "crates/peon-burrow-update",
  "crates/peon-burrow",
  "crates/peon-burrow-testkit",
  "crates/peon-burrow-examples",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV：self_update 要求 1.88（见 ai-docs/02-tech-stack.md § 5）
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/mail-peon/peon-burrow"
authors = ["imba97 <mail@imba97.cn>"]

[workspace.dependencies]
# --- 协议层：刻意保持极小（无 IO） ---
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"

# --- 引擎 ---
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
tokio-tungstenite = "0.30"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
webpki-roots = "1.0"
# TODO(S3 后续)：切到 rustls-platform-verifier（系统信任库）。它当前会拉入 aws-lc-rs（需要 C 工具链），
# 先用纯 Rust 的 webpki-roots（Mozilla 根）。见 ai-docs/02-tech-stack.md § 2 的说明。
bytes = "1.12"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"

# --- 产品层 ---
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter"] }
tracing-appender = "0.2"
clap = { version = "4.6", features = ["derive"] }
toml = "1.1"
directories = "6.0"
url = "2.5"

# --- 控制面 / 服务 / 更新（后续阶段用） ---
interprocess = "2.4"
sysinfo = "0.39"
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
semver = "1.0"
self_update = "1.3"
# ⚠️ reqwest 0.13 去掉了 `rustls-tls`（现在叫 `rustls`，而且会拉 aws-lc-rs → 需要 C 工具链）。
# 本项目政策是「只用 ring」：自更新走自己写的 HTTPS GET（tokio-rustls + rustls(ring) + webpki-roots），
# 与 peon-burrow-core 的 transport 同一套。这个条目只留给将来参考。
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "json"] }

# --- dev ---
tempfile = "3.27"
rcgen = "0.14"

# --- 内部 ---
peon-burrow-protocol = { version = "0.1.0", path = "crates/peon-burrow-protocol" }
peon-burrow-core = { version = "0.1.0", path = "crates/peon-burrow-core" }
peon-burrow-ipc-types = { version = "0.1.0", path = "crates/peon-burrow-ipc-types" }
peon-burrow-ipc = { version = "0.1.0", path = "crates/peon-burrow-ipc" }
peon-burrow-service = { version = "0.1.0", path = "crates/peon-burrow-service" }
peon-burrow-update = { version = "0.1.0", path = "crates/peon-burrow-update" }
peon-burrow-testkit = { version = "0.1.0", path = "crates/peon-burrow-testkit" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
todo = "warn"

[profile.release]
lto = "thin"
strip = true