# peon-burrow workspace —— 一个库项目：稳定层 + 一个带 `burrow` 二进制的产品 crate。
# 布局与稳定性分层见 ai-docs/modules.md、STABILITY.md；实现顺序见 ai-docs/implementation-order.md。

[workspace]
resolver = "3"
members = [
  "crates/peon-burrow-protocol",
  "crates/peon-burrow-core",
  "crates/peon-burrow-ipc-types",
  "crates/peon-burrow-ipc",
  "crates/peon-burrow-service",
  "crates/peon-burrow-update",
  "crates/peon-burrow",
  "crates/peon-burrow-testkit",
  "crates/peon-burrow-examples",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
# MSRV：self_update 要求 1.88（见 ai-docs/02-tech-stack.md § 5）
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/mail-peon/peon-burrow"
authors = ["imba97 <mail@imba97.cn>"]

[workspace.dependencies]
# --- 协议层：刻意保持极小（无 IO） ---
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"

# --- 引擎 ---
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
tokio-tungstenite = "0.30"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# ⏳ 还没用上：等它支持 ring-only（不拉 aws-lc-rs，那需要 C 工具链）就切过去，见 `adr-0010 § 5`
rustls-platform-verifier = "0.7"
webpki-roots = "1.0"
# TODO(S3 后续)：切到 rustls-platform-verifier（系统信任库）。它当前会拉入 aws-lc-rs（需要 C 工具链），
# 先用纯 Rust 的 webpki-roots（Mozilla 根）。见 ai-docs/02-tech-stack.md § 2 的说明。
bytes = "1.12"
futures-util = "0.3"
tracing = "0.1"

# --- 产品层 ---
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter"] }
clap = { version = "4.6", features = ["derive"] }
toml = "1.1"
directories = "6.0"

# --- 控制面 / 服务 / 更新 ---
# Windows 服务**入口**（SCM dispatcher + 控制码处理）。只在 `peon-burrow` 的 Windows 目标上用：
# 它管的是「服务进程内部」；`peon-burrow-service` 管的是「外部注册」（走 `sc.exe`，不依赖它）。
# 没有它的话 `sc create` 装出来的服务永远不报到 → `sc start` 报 1053（真机踩过）。
windows-service = "0.8.1"
# 把 .ico 嵌进 exe（`burrow.exe` 的图标）。**构建依赖**，只在 Windows 目标上拉。
# `default-features = false`：默认的 `toml` feature 只为读 `winresource.toml` 配置，
# 我们只用 `set_icon` + `compile`，关掉它少四个构建依赖（toml / serde_core / winnow …）。
winresource = { version = "0.1", default-features = false }
# ⚠️ 钉在 0.38：`sysinfo` 0.39（含 0.39.0）要求 rustc **1.95**，而本 workspace 声明
# `rust-version = "1.88"`（`ci.yaml` 的 msrv job 会用 1.88 真编一遍）。升它之前先确认
# 新版本的 `rust-version`，否则那条 job 会以「not supported by the following package」红掉。
sysinfo = "0.38"
sha2 = "0.11"
hex = "0.4"
semver = "1.0"

# ⚠️ 这里只放**真的被某个 crate 引用**的依赖（`cargo tree` 里查得到）。
# 提名过但最终没采用的那些（`interprocess` / `self_update` / `self-replace` / `reqwest` /
# `anyhow` / `windows-eventlog` / `url` / `base64` / `tokio-util` / `service-manager`）
# 写在 `ai-docs/02-tech-stack.md` § 1.1 里，附一句为什么 —— 空挂在 manifest 上会让人
# 以为「照表加进来就能用」（真有人这么干过：`self_update` 从没进过依赖图）。

# --- dev ---
tempfile = "3.27"
rcgen = "0.14"

# --- 内部 ---
peon-burrow-protocol = { version = "0.1.1", path = "crates/peon-burrow-protocol" }
peon-burrow-core = { version = "0.1.1", path = "crates/peon-burrow-core" }
peon-burrow-ipc-types = { version = "0.1.1", path = "crates/peon-burrow-ipc-types" }
peon-burrow-ipc = { version = "0.1.1", path = "crates/peon-burrow-ipc" }
peon-burrow-service = { version = "0.1.1", path = "crates/peon-burrow-service" }
peon-burrow-update = { version = "0.1.1", path = "crates/peon-burrow-update" }
peon-burrow-testkit = { path = "crates/peon-burrow-testkit" }  # publish = false：只留 path，发布时会被剥掉

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
todo = "warn"

[profile.release]
lto = "thin"
strip = true