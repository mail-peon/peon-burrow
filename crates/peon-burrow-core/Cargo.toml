[package]
name = "peon-burrow-core"
description = "Embeddable WebSocket to TCP/TLS relay engine with policy and backpressure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["relay", "websocket", "tcp", "tunnel", "backpressure"]
categories = ["network-programming"]

[features]
default = []
# IMAP IDLE 监听（推送「有新邮件」）。库用户默认拿到纯字节隧道，CLI 才默认开。
imap-watch = []

[dependencies]
peon-burrow-protocol = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
peon-burrow-testkit = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true