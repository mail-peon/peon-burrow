[package]
name = "peon-burrow"
description = "WebSocket to TCP/TLS relay with a service installer and self update, plus the burrow CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["relay", "websocket", "tcp", "imap", "cli"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "burrow"
path = "src/main.rs"

[lib]
name = "peon_burrow"
path = "src/lib.rs"

[features]
default = ["imap-watch"]
imap-watch = ["peon-burrow-core/imap-watch"]

[dependencies]
peon-burrow-protocol = { workspace = true }
peon-burrow-core = { workspace = true }
peon-burrow-ipc-types = { workspace = true }
peon-burrow-ipc = { workspace = true }
peon-burrow-update = { workspace = true }
peon-burrow-service = { workspace = true }
semver = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
directories = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
rustls = { workspace = true }
hex = { workspace = true }

# crate 名与 bin 名不同：cargo-binstall 需要这个才能找到产物
[package.metadata.binstall]
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.docs.rs]
all-features = true

# Windows 服务入口：`define_windows_service!` / `service_dispatcher::start` /
# `service_control_handler::register`。**只有 Windows 目标需要**（systemd / launchd
# 直接跑进程，不需要进程内握手）。
[target.'cfg(windows)'.dependencies]
windows-service = { workspace = true }

# 把 `icons/icon.ico` 嵌进 `burrow.exe`（任务管理器 / 服务列表里的图标）。
# ⚠️ 它只在**目标平台是 Windows** 时才被拉进来：CI 在 Linux 上做
# `--target x86_64-pc-windows-msvc` 检查时不该去调 `rc.exe`（见 build.rs 的两道闸）。
[target.'cfg(windows)'.build-dependencies]
winresource = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true